services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: postgres-connectsphere
    restart: always
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
      POSTGRES_DB: connectsphere_db
    ports: 
      - "5432:5432"
    volumes:
      -  postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d connectsphere_db"]
      interval: 3s
      timeout: 3s
      retries: 30  

  # Redis Cache  
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30  

  # Redis Insight    
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    

  # AUTH SERVICE (port 5001)
  auth-service: 
    build: ./auth-service
    container_name: auth-service
    restart: always
    ports: 
     - "5001:5001"
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgresql@postgres:5432/connectsphere_db"
      RUN_MIGRATIONS: "1" 
      JWT_SECRETKEY: "ndrijr5809vn_ffvn3211"
      JWT_ALGORITHM: "RS256"
      ACCESS_TOKEN_EXPIRE: "360000"
      REFRESH_TOKEN_EXPIRE: "2"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      JTI_EXPIRY: "900"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy  
         

  # CHAT SERVICE (port 5002)  
  chat-service:
    build: ./chat-service
    container_name: chat-service
    restart: always
    ports:
     - "5002:5002"
    environment:
      # If chat service also uses DB
      DATABASE_URL: "postgresql+asyncpg://postgres:postgresql@postgres:5432/connectsphere_db"
      RUN_MIGRATIONS: "1" 
      JWT_SECRETKEY: "ndrijr5809vn_ffvn3211"
      JWT_ALGORITHM: "RS256"
      ACCESS_TOKEN_EXPIRE: "360000"
      REFRESH_TOKEN_EXPIRE: "2"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      JTI_EXPIRY: "900"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started

  # CLIENT SERVICE (port 3000)     
  client:
    build: ./client
    container_name: client-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_started
      chat-service:
        condition: service_started
     

# VOLUMES
volumes:
  postgres_data:      
    


        

       

       


